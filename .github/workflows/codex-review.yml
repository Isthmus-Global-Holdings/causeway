name: Codex review

# A required check that waits for Codex to review the PR's latest commit,
# then for every finding it left to be resolved, so "merge when ready" waits
# for both. Codex out of usage, or no answer in 15 minutes, skips the wait for
# the review; the skip-codex label passes it at once. Resolving a thread
# starts no workflow, so the job stays running while findings are open (up to
# its six hours, free on a public repo) and passes once they're resolved.
# See scripts/codex-review-gate.mjs. Labels run it again both ways: taking
# skip-codex off must replace the pass that putting it on left.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# A new push makes the old wait pointless.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  codex-review:
    # Codex doesn't review drafts. A draft can't be merged anyway, and marking
    # it ready runs this again.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/codex-review-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
